# The scanner keeps a player's secret key in localStorage, so it gets its own
# origin and a CSP that only allows its own script.
server {
    listen 80;
    listen [::]:80;
    server_name qrgo.fyi www.qrgo.fyi;

    root /var/www/qrgo.fyi/html;
    index index.html;

    # app.js and style.css keep fixed names across deploys: revalidate, never cache blind.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self' wss: https://alice.btc.calendar.opentimestamps.org https://bob.btc.calendar.opentimestamps.org https://finney.calendar.eternitywall.com; media-src 'self' blob: mediastream:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }
}
